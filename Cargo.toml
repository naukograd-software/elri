[workspace]
resolver = "2"
members = [
    "crates/elri-proto",
    "crates/elri-core",
    "crates/elri-server",
    "crates/elri-cli",
    "crates/elri-daemon",
    "crates/elri-ext-example",
    "apps/elri/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/naukograd-software/elri"
rust-version = "1.95"

[workspace.dependencies]
# internal
elri-proto = { path = "crates/elri-proto" }
elri-core = { path = "crates/elri-core", default-features = false }

# transport
ws-proto = { git = "https://github.com/gopherex/ws-proto", tag = "v1.8.0" }

# protobuf
prost = "0.14"
prost-types = "0.14"
bytes = "1.10"

# async
tokio = "1"
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# storage / crdt / scripting
loro = "1.16.2"
turso = "0.8.3"
# ORM over Turso; main carries the turso 0.8 driver, releases lag at 0.7
toasty = { git = "https://github.com/tokio-rs/toasty", rev = "25b4e22ced8f8b18e00d5f48fdfbb592b820b2bd", features = ["turso"] }
toasty-driver-turso = { git = "https://github.com/tokio-rs/toasty", rev = "25b4e22ced8f8b18e00d5f48fdfbb592b820b2bd", features = ["fts"] }
mlua = { version = "0.12.2", features = ["luau", "vendored", "async", "send", "serde"] }
wasmtime = { version = "49.0.3", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation"] }
libloading = "0.8.9"

# common
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
sha2 = "0.11.1"
keyring = "4.2.0"
tokio-rustls = "0.26.6"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "http2",
    "charset",
    "json",
    "stream",
    "form",
    "socks",
    "system-proxy",
] }
webpki-roots = "1"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
# Turns on TLS in the WebSocket client ws-proto uses, so `wss://` dials work.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["rustls-tls-native-roots"] }
clap = { version = "4", features = ["derive", "env"] }

# shell
tauri = "2.12.3"
tauri-build = "2.7.2"
tauri-plugin-single-instance = "2.5.3"

[workspace.lints.rust]
# `deny`, not `forbid`: the one allowed exception is loading native
# extensions, which the user accepts as running outside the sandbox.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# trait methods are `async fn` by contract; stubs without awaits are expected
unused_async_trait_impl = "allow"

# The embedding model is too slow unoptimized, and release builds link
# with fat LTO: tests stay in the dev profile with only the math optimized.
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
