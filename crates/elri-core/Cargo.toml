[package]
name = "elri-core"
description = "elri core library: graph, CRDT, storage, sync, authorization, scripting — no shell dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
elri-proto.workspace = true
prost.workspace = true
ws-proto.workspace = true
loro.workspace = true
toasty.workspace = true
toasty-driver-turso.workspace = true
tokio = { workspace = true, features = ["rt", "net", "sync", "macros", "fs", "io-util"] }
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
sha2.workspace = true
mlua.workspace = true
wasmtime.workspace = true
keyring = { workspace = true, optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
libloading.workspace = true

[features]
default = ["keyring"]
# The operating system's credential store for the server token. Off on
# Android and iOS, where the file backend is used.
keyring = ["dep:keyring"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
sha2.workspace = true
wat = "1"
