# Changes in this area may be lost on regeneration.
proto_full = ["elri-v1-account","elri-v1-change","elri-v1-core","elri-v1-definition","elri-v1-events","elri-v1-object","elri-v1-remote","elri-v1-search","elri-v1-space","elri-v1-sync"]
"elri-v1-account" = []
"elri-v1-change" = []
"elri-v1-core" = []
"elri-v1-definition" = []
"elri-v1-events" = ["elri-v1-change","elri-v1-object"]
"elri-v1-object" = ["elri-v1-definition"]
"elri-v1-remote" = ["elri-v1-space"]
"elri-v1-search" = ["elri-v1-object"]
"elri-v1-space" = []
"elri-v1-sync" = ["elri-v1-object","elri-v1-space"]
