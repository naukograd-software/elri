[package]
name = "elri-server"
description = "elri authoritative synchronization server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "elri-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
elri-core = { workspace = true, features = ["keyring"] }
elri-proto.workspace = true
ws-proto.workspace = true
toasty.workspace = true
toasty-driver-turso.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "signal", "sync"] }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
uuid.workspace = true
rand.workspace = true
sha2.workspace = true
serde_json.workspace = true
tokio-rustls.workspace = true

[dev-dependencies]
anyhow.workspace = true
rcgen = "0.14.10"
