syntax = "proto3";

package elri.v1.definition;

/*
Definitions are Objects: a field definition fixes the kind of value a field
holds, a type definition groups field definitions, a role definition names a
participant role. Objects refer to definitions by id; display names are
labels and never identify anything.
*/

/* Storage kind of a field; fixed for the life of the definition. */
enum FieldKind {
    FIELD_KIND_UNSPECIFIED = 0;
    FIELD_KIND_BOOL = 1;
    FIELD_KIND_INT = 2;
    FIELD_KIND_DOUBLE = 3;
    FIELD_KIND_STRING = 4;
    FIELD_KIND_TIME = 5;
    FIELD_KIND_REF = 6;
    /* Collaborative text. */
    FIELD_KIND_TEXT = 7;
    /* Ordered list of scalars. */
    FIELD_KIND_LIST = 8;
    /* String-keyed map of scalars. */
    FIELD_KIND_MAP = 9;
    /* Collaborative text with formatting marks; plain text values fit too. */
    FIELD_KIND_RICH_TEXT = 10;
}

message FieldDefinition {
    string id = 1;
    string space_id = 2;
    string name = 3;
    string description = 4;
    FieldKind kind = 5;
    int64 created_at_ms = 6;
    int64 updated_at_ms = 7;
    optional int64 deleted_at_ms = 8;
}

/* A field as part of a type. */
message TypeField {
    string field_id = 1;
    bool required = 2;
}

message TypeDefinition {
    string id = 1;
    string space_id = 2;
    string name = 3;
    string description = 4;
    repeated TypeField fields = 5;
    int64 created_at_ms = 6;
    int64 updated_at_ms = 7;
    optional int64 deleted_at_ms = 8;
}

message RoleDefinition {
    string id = 1;
    string space_id = 2;
    string name = 3;
    string description = 4;
    int64 created_at_ms = 5;
    int64 updated_at_ms = 6;
    optional int64 deleted_at_ms = 7;
}

/*
An immutable published version of a definition: its logical snapshot, the
exact versions of the definitions it depends on, and a digest over both.
Pins reference publications, never live definitions, so what a Space
agreed on cannot drift.
*/
message Publication {
    string id = 1;
    string space_id = 2;
    /* The definition published. */
    string definition_id = 3;
    /* 1, 2, 3, ... per definition. */
    int32 version = 4;
    /* Canonical JSON of the definition at publication. */
    string snapshot_json = 5;
    /* Definition id → version of the publications this one depends on. */
    map<string, int32> dependencies = 6;
    /* Hex SHA-256 over the canonical snapshot and dependencies. */
    string digest = 7;
    int64 created_at_ms = 8;
}

/* The version of a definition a Space has agreed to use. */
message Pin {
    string definition_id = 1;
    string publication_id = 2;
    int32 version = 3;
    /* Schema epoch after this pin was applied. */
    int64 epoch = 4;
}

/* Every pin of a Space, under one epoch that changes with each pin. */
message Schema {
    int64 epoch = 1;
    repeated Pin pins = 2;
}

/*
A declarative constraint over one field of a Space, from the built-in
validator set: uniqueness of a scalar value among live Objects. By default
a constraint is diagnostic: violations are listed, nothing is refused.
A strict constraint refuses the write; on a server Space only an Owner or
Admin may make one strict, and offline checks stay provisional: of two
offline claims the server accepts one and rejects the other.
*/
message Constraint {
    string id = 1;
    string space_id = 2;
    string name = 3;
    /* The field definition the constraint is about. */
    string field_id = 4;
    /* Values must be unique among live Objects; empty values are ignored. */
    bool unique = 5;
    /* Refuse writes instead of reporting. */
    bool strict = 6;
    int64 created_at_ms = 7;
    int64 updated_at_ms = 8;
    optional int64 deleted_at_ms = 9;
}

/* Objects that share a value a constraint says must be unique. */
message Violation {
    string constraint_id = 1;
    string field_id = 2;
    /* The shared value, as text. */
    string value = 3;
    repeated string object_ids = 4;
}
