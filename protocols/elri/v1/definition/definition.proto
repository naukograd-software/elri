syntax = "proto3";

package elri.v1.definition;

import "elri/v1/definition/domain.proto";

/*
Typed access to definitions. They are ordinary Objects too: ObjectService
can read and delete them by id.
*/
service DefinitionService {
    rpc CreateFieldDefinition(CreateFieldDefinitionRequest) returns (CreateFieldDefinitionResponse);
    /* Name and description only; the kind never changes. */
    rpc UpdateFieldDefinition(UpdateFieldDefinitionRequest) returns (UpdateFieldDefinitionResponse);
    rpc ListFieldDefinitions(ListFieldDefinitionsRequest) returns (ListFieldDefinitionsResponse);

    rpc CreateTypeDefinition(CreateTypeDefinitionRequest) returns (CreateTypeDefinitionResponse);
    rpc UpdateTypeDefinition(UpdateTypeDefinitionRequest) returns (UpdateTypeDefinitionResponse);
    rpc ListTypeDefinitions(ListTypeDefinitionsRequest) returns (ListTypeDefinitionsResponse);

    rpc CreateRoleDefinition(CreateRoleDefinitionRequest) returns (CreateRoleDefinitionResponse);
    rpc ListRoleDefinitions(ListRoleDefinitionsRequest) returns (ListRoleDefinitionsResponse);
    /* Freezes a definition as its next version; type definitions pin the
       current publications of their fields as dependencies. */
    rpc PublishDefinition(PublishDefinitionRequest) returns (PublishDefinitionResponse);
    rpc ListPublications(ListPublicationsRequest) returns (ListPublicationsResponse);
    /*
    Makes a publication the Space's agreed version of its definition,
    against an expected schema epoch. Local Spaces apply it at once; a
    server Space asks the server (Owner/Admin) and the pin arrives with
    the log.
    */
    rpc PinDefinition(PinDefinitionRequest) returns (PinDefinitionResponse);
    rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);
    rpc CreateConstraint(CreateConstraintRequest) returns (CreateConstraintResponse);
    rpc UpdateConstraint(UpdateConstraintRequest) returns (UpdateConstraintResponse);
    rpc ListConstraints(ListConstraintsRequest) returns (ListConstraintsResponse);
    /* Where the live state contradicts the Space's constraints, strict or
       not: what a user repairs by hand. */
    rpc ListViolations(ListViolationsRequest) returns (ListViolationsResponse);
}

message CreateConstraintRequest {
    string space_id = 1;
    string name = 2;
    string field_id = 3;
    bool unique = 4;
    bool strict = 5;
}

message CreateConstraintResponse {
    Constraint constraint = 1;
}

message UpdateConstraintRequest {
    string space_id = 1;
    string id = 2;
    optional string name = 3;
    optional bool strict = 4;
}

message UpdateConstraintResponse {
    Constraint constraint = 1;
}

message ListConstraintsRequest {
    string space_id = 1;
    bool include_deleted = 2;
}

message ListConstraintsResponse {
    repeated Constraint constraints = 1;
}

message ListViolationsRequest {
    string space_id = 1;
}

message ListViolationsResponse {
    repeated Violation violations = 1;
}

message PublishDefinitionRequest {
    string space_id = 1;
    string id = 2;
}

message PublishDefinitionResponse {
    Publication publication = 1;
}

message ListPublicationsRequest {
    string space_id = 1;
    /* Only publications of this definition, if set. */
    string definition_id = 2;
}

message ListPublicationsResponse {
    repeated Publication publications = 1;
}

message PinDefinitionRequest {
    string space_id = 1;
    string publication_id = 2;
    /* The epoch the caller saw; the pin is refused if it moved. */
    int64 expected_epoch = 3;
}

message PinDefinitionResponse {
    Pin pin = 1;
}

message GetSchemaRequest {
    string space_id = 1;
}

message GetSchemaResponse {
    Schema schema = 1;
}

message CreateFieldDefinitionRequest {
    string space_id = 1;
    string name = 2;
    string description = 3;
    FieldKind kind = 4;
}

message CreateFieldDefinitionResponse {
    FieldDefinition definition = 1;
}

message UpdateFieldDefinitionRequest {
    string space_id = 1;
    string id = 2;
    optional string name = 3;
    optional string description = 4;
}

message UpdateFieldDefinitionResponse {
    FieldDefinition definition = 1;
}

message ListFieldDefinitionsRequest {
    string space_id = 1;
    bool include_deleted = 2;
}

message ListFieldDefinitionsResponse {
    repeated FieldDefinition definitions = 1;
}

message CreateTypeDefinitionRequest {
    string space_id = 1;
    string name = 2;
    string description = 3;
    repeated TypeField fields = 4;
}

message CreateTypeDefinitionResponse {
    TypeDefinition definition = 1;
}

message UpdateTypeDefinitionRequest {
    string space_id = 1;
    string id = 2;
    optional string name = 3;
    optional string description = 4;
    /* Add or replace fields by field id. */
    repeated TypeField set_fields = 5;
    repeated string remove_fields = 6;
}

message UpdateTypeDefinitionResponse {
    TypeDefinition definition = 1;
}

message ListTypeDefinitionsRequest {
    string space_id = 1;
    bool include_deleted = 2;
}

message ListTypeDefinitionsResponse {
    repeated TypeDefinition definitions = 1;
}

message CreateRoleDefinitionRequest {
    string space_id = 1;
    string name = 2;
    string description = 3;
}

message CreateRoleDefinitionResponse {
    RoleDefinition definition = 1;
}

message ListRoleDefinitionsRequest {
    string space_id = 1;
    bool include_deleted = 2;
}

message ListRoleDefinitionsResponse {
    repeated RoleDefinition definitions = 1;
}
