syntax = "proto3";

package elri.v1.search;

import "elri/v1/object/domain.proto";

/* Full-text search over the text of a Space's Objects. */
service SearchService {
    /* Best matches first. */
    rpc Search(SearchRequest) returns (SearchResponse);
    /* The semantic index on this device: model, readiness, backlog. */
    rpc GetSemanticStatus(GetSemanticStatusRequest) returns (GetSemanticStatusResponse);
    /* Downloads the pinned model if missing (through the device's proxy)
       and loads it. Returns at once; the status tells the progress. */
    rpc PrepareSemantic(PrepareSemanticRequest) returns (PrepareSemanticResponse);
}

/* How to match. Unspecified = LEXICAL. */
enum SearchMode {
    SEARCH_MODE_UNSPECIFIED = 0;
    /* Words in text fields. */
    SEARCH_MODE_LEXICAL = 1;
    /* Meaning, by the local embedding model. */
    SEARCH_MODE_SEMANTIC = 2;
    /* Both, fused by rank. */
    SEARCH_MODE_HYBRID = 3;
}

enum SemanticState {
    SEMANTIC_STATE_UNSPECIFIED = 0;
    /* Switched off in the settings. */
    SEMANTIC_STATE_OFF = 1;
    /* The model is not on this device. */
    SEMANTIC_STATE_MISSING = 2;
    SEMANTIC_STATE_DOWNLOADING = 3;
    SEMANTIC_STATE_LOADING = 4;
    SEMANTIC_STATE_READY = 5;
    SEMANTIC_STATE_FAILED = 6;
}

message SemanticStatus {
    SemanticState state = 1;
    /* Model and revision, e.g. `intfloat/multilingual-e5-small@614241f`. */
    string model = 2;
    int64 bytes_done = 3;
    int64 bytes_total = 4;
    string error = 5;
    /* Objects waiting to be indexed, over every Space. */
    int64 pending = 6;
}

message GetSemanticStatusRequest {}

message GetSemanticStatusResponse {
    SemanticStatus status = 1;
}

message PrepareSemanticRequest {}

message PrepareSemanticResponse {
    SemanticStatus status = 1;
}

message SearchRequest {
    string space_id = 1;
    /* Words to find; `AND`, `OR`, quoted phrases, and `-word` are understood. */
    string query = 2;
    /* Unspecified searches every kind. */
    elri.v1.object.ObjectKind kind = 3;
    /* 0 = server default. */
    int32 limit = 4;
    /* Only hits in the fields an approved mapping of this Space names for
       it, if set. Lexical matching only. */
    string mapping_id = 5;
    SearchMode mode = 6;
}

message Hit {
    elri.v1.object.Object object = 1;
    /* Relevance; comparable within one response only. */
    double score = 2;
    /* Field-definition ids whose text matched. */
    repeated string fields = 3;
    /* Why it matched: `words` (lexical) and/or `meaning` (semantic). */
    repeated string reasons = 4;
    /* Cosine similarity of the meaning match, when there is one. */
    double similarity = 5;
}

message SearchResponse {
    repeated Hit hits = 1;
    Watermark watermark = 2;
}

/* How complete the answer is. The text index is written with the data,
   so it is never behind the data this device holds; the data itself may
   be behind the server. */
message Watermark {
    /* Highest server sequence installed locally; 0 for a local-only
       Space or before the first delivery. */
    int64 data_seq = 1;
    /* Sequence the text index covers; equal to `data_seq`. */
    int64 index_seq = 2;
    /* The initial download has not finished: results come from a partial
       copy. */
    bool partial = 3;
    /* Sequence the initial download must reach, when partial. */
    int64 target_seq = 4;
    /* Semantic index of this Space: objects still waiting to be indexed,
       and the model's state. Meaning results are partial while either is
       not settled. */
    int64 semantic_pending = 5;
    SemanticState semantic_state = 6;
}
