syntax = "proto3";

package elri.v1.space;

/* Role of the current user in a Space. */
enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_OWNER = 1;
    ROLE_ADMIN = 2;
    ROLE_EDITOR = 3;
    ROLE_VIEWER = 4;
}

/* Where the authoritative registry of a Space lives. */
enum Authority {
    AUTHORITY_UNSPECIFIED = 0;
    /* Local-only Space; the local core is the registry. */
    AUTHORITY_LOCAL = 1;
    /* Server-hosted Space replicated to this device. */
    AUTHORITY_SERVER = 2;
}

message Space {
    /* UUIDv7, canonical string form. */
    string id = 1;
    string name = 2;
    Role role = 3;
    Authority authority = 4;
    /* Server Spaces: highest accepted sequence on the server when listed. */
    int64 last_seq = 5;
    /* Days a deleted Object stays recoverable before the authority purges it. */
    int32 retention_days = 6;
}

/* An operation a transfer rule governs. */
enum TransferOp {
    TRANSFER_OP_UNSPECIFIED = 0;
    /* Writing what was read from this Space into another Space: a script
       or handler that read here and writes there, an import of a bundle
       exported from here, a move. */
    TRANSFER_OP_COPY = 1;
    /* Exporting a bundle from this Space. */
    TRANSFER_OP_EXPORT = 2;
    /* Passing what was read from this Space to code outside the core: an
       extension function. */
    TRANSFER_OP_EXTERNAL = 3;
}

enum TransferOutcome {
    TRANSFER_OUTCOME_UNSPECIFIED = 0;
    TRANSFER_OUTCOME_ALLOW = 1;
    /* The user must confirm each time; code cannot. */
    TRANSFER_OUTCOME_ASK = 2;
    /* Mandatory: no confirmation overrides it. */
    TRANSFER_OUTCOME_DENY = 3;
}

/* One rule of a Space's transfer policy. The rule naming the destination
   wins over the rule for any destination; among equals the later wins;
   without a rule the operation is allowed. */
message TransferRule {
    TransferOp op = 1;
    /* A Space id, `extension:<name>`, or empty for any destination. */
    string destination = 2;
    TransferOutcome outcome = 3;
}

/* The transfer rules of a Space: what may leave it, and where. */
message TransferPolicy {
    string space_id = 1;
    repeated TransferRule rules = 2;
    int64 updated_at_ms = 3;
}
