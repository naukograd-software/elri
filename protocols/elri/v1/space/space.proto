syntax = "proto3";

package elri.v1.space;

import "elri/v1/space/domain.proto";

/*
Spaces known to this core: local-only Spaces and server Spaces selected for
synchronization. Membership and roles are server-authoritative.
*/
service SpaceService {
    rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse);
    /* Creates a local-only Space on this device. */
    rpc CreateSpace(CreateSpaceRequest) returns (CreateSpaceResponse);
    /* Local Spaces: how long deleted Objects stay recoverable before the
       core purges them. Server Spaces take the server's setting. */
    rpc SetRetention(SetRetentionRequest) returns (SetRetentionResponse);
}

message SetRetentionRequest {
    string space_id = 1;
    /* 0 keeps deleted Objects until an explicit purge. */
    int32 days = 2;
}

message SetRetentionResponse {
    int32 days = 1;
}

message ListSpacesRequest {}

message ListSpacesResponse {
    repeated Space spaces = 1;
}

message CreateSpaceRequest {
    string name = 1;
}

message CreateSpaceResponse {
    Space space = 1;
}
