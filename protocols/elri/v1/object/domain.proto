syntax = "proto3";

package elri.v1.object;

import "elri/v1/definition/domain.proto";

/* What an Object is. Every kind shares the same document shape. */
enum ObjectKind {
    OBJECT_KIND_UNSPECIFIED = 0;
    OBJECT_KIND_ENTITY = 1;
    OBJECT_KIND_RELATION = 2;
    OBJECT_KIND_LAYER = 3;
    /* A field definition; see elri.v1.definition. */
    OBJECT_KIND_FIELD_DEF = 4;
    /* A type definition. */
    OBJECT_KIND_TYPE_DEF = 5;
    /* A participant-role definition. */
    OBJECT_KIND_ROLE_DEF = 6;
    /* Immutable bytes with display metadata; see elri.v1.attachment. */
    OBJECT_KIND_ATTACHMENT = 7;
    /* Luau source with a manifest; see elri.v1.script. */
    OBJECT_KIND_SCRIPT = 8;
    /* Runs a script when something happens; see elri.v1.script. */
    OBJECT_KIND_RULE = 9;
    /* A tree of interface nodes drawn by the renderer; see elri.v1.ui. */
    OBJECT_KIND_INTERFACE = 10;
    /* An immutable published version of a definition; see elri.v1.definition. */
    OBJECT_KIND_PUBLICATION = 11;
    /* A selection of Spaces, Layers, filters, and Views; see elri.v1.context. */
    OBJECT_KIND_CONTEXT = 12;
    /* A declarative constraint over a field; see elri.v1.definition. */
    OBJECT_KIND_CONSTRAINT = 13;
    /* A reusable interface subtree with parameters. */
    OBJECT_KIND_COMPONENT = 14;
    /* The transfer rules of a Space; one per Space, set by its managers. */
    OBJECT_KIND_TRANSFER_POLICY = 15;
    /* A semantic mapping: fields of several Spaces that mean the same. */
    OBJECT_KIND_MAPPING = 16;
    /* An agent configuration. */
    OBJECT_KIND_AGENT = 17;
    /* Instructions an agent loads on demand. */
    OBJECT_KIND_SKILL = 18;
    /* A reusable piece of instructions. */
    OBJECT_KIND_PROMPT = 19;
    /* A conversation with an agent. */
    OBJECT_KIND_CONVERSATION = 20;
}

/* Items of a list value; scalars only. */
message ValueList {
    repeated Value items = 1;
}

/* One formatting mark over a range of rich text, in Unicode scalar offsets. */
message Mark {
    int32 start = 1;
    int32 end = 2;
    /* `bold`, `italic`, `underline`, `link`, `comment`, or any other key. */
    string key = 3;
    /* The mark's value as JSON: `true` for a plain style, a string for a link. */
    string value_json = 4;
}

/* Collaborative text with formatting marks. Text edits merge character by
   character; marks merge by range and survive edits around them. */
message RichText {
    string text = 1;
    repeated Mark marks = 2;
}

/* Entries of a map value; scalars only. Concurrent edits to different keys
   both land; the same key is last-writer-wins. */
message ValueMap {
    map<string, Value> entries = 1;
}

/*
A field value. Fields are keyed by field-definition id; the definition fixes
which variant is valid.

`string` is a last-writer-wins scalar. `text` is collaborative: concurrent
edits merge character by character, and setting it applies the minimal
difference to the current text rather than replacing it. `list` is an ordered
collection of scalars; setting it applies the minimal insertions and
deletions.
*/
message Value {
    oneof value {
        bool bool = 1;
        int64 int = 2;
        double double = 3;
        string string = 4;
        /* Milliseconds since the Unix epoch, UTC. */
        int64 time_ms = 5;
        /* Reference to another Object by id. */
        string ref = 6;
        string text = 7;
        ValueList list = 8;
        ValueMap map = 9;
        RichText rich = 10;
    }
}

/* One participant of a Relation. */
message Participant {
    /* Stable slot id chosen by the writer; unique within the Relation. */
    string slot = 1;
    /* The participating Object. */
    string object_id = 2;
    /* Participant-role definition id; may be empty. */
    string role_id = 3;
}

/*
One position of a block inside a document. A block is an Object of its own;
a placement only puts it somewhere in the tree. Placement identity is
separate from block identity: removing a placement leaves the block in
place, and one block may be placed more than once.
*/
message Placement {
    /* Placement id, assigned by the core and stable across moves. */
    string id = 1;
    /* Parent placement id; empty at the top level. */
    string parent_id = 2;
    /* Position among siblings, from 0. */
    int32 index = 3;
    /* The placed block Object. */
    string block_id = 4;
}

message Object {
    /* UUIDv7, canonical string form. */
    string id = 1;
    string space_id = 2;
    ObjectKind kind = 3;
    /* Ids of type definitions applied to this Object. */
    repeated string types = 4;
    /* Field-definition id → value. */
    map<string, Value> fields = 5;
    int64 created_at_ms = 6;
    int64 updated_at_ms = 7;
    /* Set when the Object is deleted and awaiting purge. */
    optional int64 deleted_at_ms = 8;
    /* Relations only. */
    repeated Participant participants = 9;
    /* Layers only: the Object this Layer enriches. */
    optional string target_id = 10;
    /* Type definitions only: the fields of the type. */
    repeated elri.v1.definition.TypeField type_fields = 11;
    /* Entities only: placed blocks, parents before children, siblings in order. */
    repeated Placement placements = 12;
}

/* Where an AI hypothesis stands. */
enum HypothesisStatus {
    HYPOTHESIS_STATUS_UNSPECIFIED = 0;
    HYPOTHESIS_STATUS_PROPOSED = 1;
    /* A person confirmed it; the agent stays its author. */
    HYPOTHESIS_STATUS_CONFIRMED = 2;
    /* A person rejected it; the Layer is deleted and purged with the
       Space's retention. */
    HYPOTHESIS_STATUS_REJECTED = 3;
}

/*
A hypothesis: a Layer an agent proposed over an Object. It carries who
proposed it, what the agent was, what it read, and why; a review by a
person is recorded apart and never replaces the author. Only the agent
that proposed it may revise it; a person reviews it.
*/
message Hypothesis {
    /* The actor that proposed it: `script:<id>` or `rule:<id>/script:<id>`. */
    string agent = 1;
    /* Model identification the agent gave, if any. */
    string model = 2;
    /* Object ids the proposal rests on. */
    repeated string sources = 3;
    /* The agent's stated reason. */
    string basis = 4;
    HypothesisStatus status = 5;
    /* `user` once reviewed. */
    string reviewed_by = 6;
    int64 reviewed_at_ms = 7;
    /* The reviewer's note. */
    string note = 8;
}
