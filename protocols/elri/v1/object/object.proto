syntax = "proto3";

package elri.v1.object;

import "elri/v1/object/domain.proto";

/* Create, read, and change Objects of a Space. */
service ObjectService {
    rpc CreateObject(CreateObjectRequest) returns (CreateObjectResponse);
    rpc GetObject(GetObjectRequest) returns (GetObjectResponse);
    /* Sets and removes fields and types in one write. */
    rpc UpdateObject(UpdateObjectRequest) returns (UpdateObjectResponse);
    /* Marks the Object deleted; it stays recoverable until purge. */
    rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);
    rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);
}

message CreateObjectRequest {
    string space_id = 1;
    ObjectKind kind = 2;
    repeated string types = 3;
    map<string, Value> fields = 4;
    /* Relations only. */
    repeated Participant participants = 5;
    /* Layers only; required for them. */
    string target_id = 6;
}

message CreateObjectResponse {
    Object object = 1;
}

message GetObjectRequest {
    string space_id = 1;
    string id = 2;
}

message GetObjectResponse {
    Object object = 1;
}

message UpdateObjectRequest {
    string space_id = 1;
    string id = 2;
    map<string, Value> set_fields = 3;
    repeated string remove_fields = 4;
    repeated string add_types = 5;
    repeated string remove_types = 6;
    /* Relations only: add or replace participants by slot. */
    repeated Participant set_participants = 7;
    /* Relations only: slots to remove. */
    repeated string remove_participants = 8;
    /*
    Entities only: an empty id places `block_id` at `parent_id`/`index`; a
    known id moves that placement there.
    */
    repeated Placement set_placements = 9;
    /* Entities only: placements to remove, with their subtrees. Blocks stay. */
    repeated string remove_placements = 10;
}

message UpdateObjectResponse {
    Object object = 1;
}

message DeleteObjectRequest {
    string space_id = 1;
    string id = 2;
}

message DeleteObjectResponse {}

message ListObjectsRequest {
    string space_id = 1;
    /* Unspecified lists every kind. */
    ObjectKind kind = 2;
    /* Only Objects carrying this type definition, if set. */
    string type_id = 3;
    /* Deleted Objects are hidden unless requested. */
    bool include_deleted = 4;
    /* 0 = server default. */
    int32 limit = 5;
    /* Only Relations in which this Object participates, if set. */
    string participant_object_id = 6;
    /* Only Layers over this Object, if set. */
    string target_id = 7;
    /* Only Entities that place this block, if set. */
    string placed_block_id = 8;
}

message ListObjectsResponse {
    repeated Object objects = 1;
}
