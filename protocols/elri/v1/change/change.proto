syntax = "proto3";

package elri.v1.change;

import "elri/v1/change/domain.proto";

/* Inspect the Changes a Space has recorded on this device. */
service ChangeService {
    /* Newest first. */
    rpc ListChanges(ListChangesRequest) returns (ListChangesResponse);
    /*
    Resubmits a rejected Change unchanged, with the same id and payload, and
    puts its operations and those of its paused dependents back into the
    live documents.
    */
    rpc RetryChange(RetryChangeRequest) returns (RetryChangeResponse);
    /* Drops a rejected or paused Change and its paused dependents for good. */
    rpc DiscardChange(DiscardChangeRequest) returns (DiscardChangeResponse);
}

message RetryChangeRequest {
    string space_id = 1;
    string id = 2;
}

message RetryChangeResponse {
    Change change = 1;
}

message DiscardChangeRequest {
    string space_id = 1;
    string id = 2;
}

message DiscardChangeResponse {
    /* Ids of every Change dropped, the requested one included. */
    repeated string discarded = 1;
}

message ListChangesRequest {
    string space_id = 1;
    /* 0 = server default. */
    int32 limit = 2;
    /* Only Changes that touched this Object: its history, newest first. */
    string object_id = 3;
}

message ListChangesResponse {
    repeated Change changes = 1;
}
