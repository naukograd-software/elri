[graph]
all-features = true

[advisories]
ignore = [
    # proc-macro-error via gtk/libappindicator/tray-icon inside tauri; no fix upstream yet
    "RUSTSEC-2024-0370",
    # im / bitmaps / sized-chunks: loro-internal depends on `im`; tracked upstream
    "RUSTSEC-2026-0247",
    "RUSTSEC-2026-0248",
    "RUSTSEC-2026-0251",
    # atomic-polyfill: transitive, no_std shim; no replacement in the pinned graph
    "RUSTSEC-2023-0089",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "AGPL-3.0-only",
    # Boost Software License (xxhash-rust)
    "BSL-1.0",
    # MIT No Attribution (borrow-or-share via toasty)
    "MIT-0",
    # Community Data License, permissive: the Mozilla CA root list
    # (webpki-roots, webpki-root-certs via reqwest)
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/gopherex/ws-proto", "https://github.com/tokio-rs/toasty"]
